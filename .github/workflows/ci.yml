name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Unit Tests & Lint (minSdk 27)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests & Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Verify 0 NewApi Lint Violations (minSdk 27 guard)
        run: |
          REPORT="app/build/reports/lint-results-debug.xml"
          if [ -f "$REPORT" ] && grep -q 'id="NewApi"' "$REPORT"; then
            echo "::error::Found NewApi lint violations in $REPORT (must guard API 28+ calls for minSdk 27)"
            grep -C 3 'id="NewApi"' "$REPORT"
            exit 1
          fi
