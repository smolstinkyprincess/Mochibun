<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochibun (もちぶん) ♡</title>
  <style>
    :root {
      --sky-top: #fbf0f5;
      --sky-mid: #f5eef8;
      --sky-bottom: #edf0fc;
      --card-bg: #ffffff;
      --card-inner: #fffafd;
      --border: #eedcf0;
      --text: #412348;
      --text-muted: #845f8f;
      --accent-pink: #efaac4;
      --accent-lavender: #d6ccf8;
      --accent-glow: rgba(246, 185, 215, 0.4);
      --shadow: 0 12px 32px rgba(215, 190, 225, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: 
        radial-gradient(circle at 15% 15%, rgba(255, 225, 238, 0.7) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(225, 220, 255, 0.7) 0%, transparent 40%),
        linear-gradient(170deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 860px;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    .celestial-bar {
      font-size: 1.1rem;
      letter-spacing: 0.5rem;
      color: var(--accent-lavender);
      margin-bottom: 0.8rem;
      user-select: none;
    }

    .profile-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 30px;
      padding: 2.4rem 1.8rem 2rem;
      box-shadow: var(--shadow);
      position: relative;
    }

    .bow-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f7b7ce, #dfb4f5);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.28rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
      white-space: nowrap;
    }

    .avatar-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0.4rem auto 1rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid var(--accent-pink);
      border-radius: 50%;
      box-shadow: 0 4px 14px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 0.35rem;
    }

    .bio {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.8rem;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7b7ce, #e0b0ff);
      color: #ffffff;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--card-inner);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .screenshots-section {
      margin-top: 1rem;
      text-align: center;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .screenshots-grid {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
      overflow-x: auto;
      padding: 0.5rem 0.5rem 1.25rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .screenshot-card {
      flex: 0 0 auto;
      width: 175px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #fff;
      box-shadow: 0 6px 20px rgba(215, 190, 225, 0.25);
      scroll-snap-align: center;
    }

    .screenshot-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      margin-top: 2.2rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="celestial-bar">✧ ˚ ☽ ˚ ✧</div>

    <div class="profile-card">
      <div class="bow-badge">౨ৎ Mochibun ౨ৎ</div>

      <div class="avatar-wrapper">
        <div class="avatar">🍡</div>
      </div>

      <h1>Mochibun (もちぶん) ♡</h1>
      <p class="bio">A pastel, T9-oriented Android launcher and virtual cursor daemon crafted specifically for the ALT Mive Style Folder (AT-M120).</p>

      <div class="btn-row">
        <a id="download-btn" href="https://github.com/smolstinkyprincess/Mochibun/releases/latest" class="btn btn-primary">
          Download Mochibun (Latest APK)
        </a>
        <a href="https://github.com/smolstinkyprincess/Mochibun" class="btn btn-secondary" target="_blank" rel="noopener">
          View on GitHub
        </a>
      </div>

      <div class="screenshots-section">
        <div class="section-label">✦ Interface Showcase ✦</div>
        <div class="screenshots-grid">
          <div class="screenshot-card">
            <img src="screenshots/1_home.png" alt="Home Screen" onerror="this.style.display='none'">
          </div>
          <div class="screenshot-card">
            <img src="screenshots/2_folder.png" alt="App Drawer" onerror="this.style.display='none'">
          </div>
          <div class="screenshot-card">
            <img src="screenshots/3_appdrawer.png" alt="Now Playing" onerror="this.style.display='none'">
          </div>
          <div class="screenshot-card">
            <img src="screenshots/4_recents.png" alt="Theme Studio" onerror="this.style.display='none'">
          </div>
        </div>
      </div>
    </div>

    <footer>
      <span>made with stardust, ♡ & eepy magic</span>
    </footer>
  </div>

  <script>
    (async function() {
      try {
        const response = await fetch('https://api.github.com/repos/smolstinkyprincess/Mochibun/releases/latest');
        if (!response.ok) return;
        const release = await response.json();
        const apkAsset = release.assets.find(asset => asset.name.endsWith('.apk'));
        const btn = document.getElementById('download-btn');
        if (btn && apkAsset) {
          btn.href = apkAsset.browser_download_url;
          btn.textContent = `Download Mochibun ${release.tag_name} (${(apkAsset.size / (1024 * 1024)).toFixed(2)} MB)`;
        }
      } catch (err) {
        console.warn("Falling back to latest release link", err);
      }
    })();
  </script>

</body>
</html>
