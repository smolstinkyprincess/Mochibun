<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochibun (もちぶん) ♡</title>
  <style>
    :root {
      --sky-top: #fbf0f5;
      --sky-mid: #f5eef8;
      --sky-bottom: #edf0fc;
      --card-bg: #ffffff;
      --card-inner: #fffafd;
      --border: #eedcf0;
      --border-bright: #ffffff;
      --text: #412348;
      --text-muted: #845f8f;
      --accent-pink: #efaac4;
      --accent-lavender: #d6ccf8;
      --accent-glow: rgba(246, 185, 215, 0.4);
      --shadow: 0 12px 32px rgba(215, 190, 225, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 225, 238, 0.7) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(225, 220, 255, 0.7) 0%, transparent 40%),
        linear-gradient(170deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 860px;
      width: 100%;
      text-align: center;
    }

    .celestial-bar {
      font-size: 1.1rem;
      letter-spacing: 0.5rem;
      color: var(--accent-lavender);
      margin-bottom: 0.8rem;
      user-select: none;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .profile-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 30px;
      padding: 2.4rem 1.8rem 2rem;
      box-shadow: var(--shadow);
      position: relative;
    }

    .bow-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f7b7ce, #dfb4f5);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.28rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
      white-space: nowrap;
    }

    .avatar-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0.4rem auto 1rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid var(--accent-pink);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 14px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sparkle-decor {
      position: absolute;
      font-size: 0.85rem;
      color: #f7b7ce;
      user-select: none;
    }
    .sparkle-1 { top: -2px; right: -8px; }
    .sparkle-2 { bottom: 2px; left: -8px; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 0.35rem;
    }

    .bio {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.8rem;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Action Buttons */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7b7ce, #e0b0ff);
      color: #ffffff;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(242, 170, 196, 0.4);
    }

    .btn-secondary {
      background: var(--card-inner);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: var(--accent-lavender);
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(214, 204, 248, 0.25);
    }

    /* Screenshots Showcase */
    .screenshots-section {
      margin-top: 1rem;
      text-align: center;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .screenshots-grid {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
      overflow-x: auto;
      padding: 0.5rem 0.5rem 1.25rem;
